          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Normalmente i dati sulle conversioni vengono raccolti dal browser del visitatore, che però blocca gli script, e dagli ad blocker, che bloccano i pixel. Il tracciamento server-side sposta la raccolta su un server dedicato: i dati arrivano completi e le piattaforme pubblicitarie possono ottimizzare su informazioni reali."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto costa e quanto tempo serve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "L'audit parte da 490 €. Il setup completo da 1.500 € per un sito non-ecommerce, con tempi di circa una giornata di lavoro. Per gli ecommerce il tempo dipende da piattaforma e numero di prodotti: da una a tre giornate. Il canone di infrastruttura e monitoraggio parte da 100 €/mese."
          }
        },
        {
          "@type": "Question",
          "name": "Il tracciamento server-side è conforme al GDPR?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "È lo strumento che rende la conformità più gestibile, non meno: il consenso viene rispettato a monte tramite Consent Mode v2 e i dati passano da un'infrastruttura che controlliamo. Non siamo consulenti legali e non forniamo pareri: implementiamo quello che il tuo DPO o consulente privacy definisce."
          }
        },
        {
          "@type": "Question",
          "name": "Che tipo di automazioni fate, concretamente?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Automazioni su problemi precisi, non progetti di trasformazione digitale. Per esempio: le richieste che arrivano su WhatsApp e finiscono nel CRM già strutturate, con una prima risposta automatica in meno di un minuto. Oppure un assistente sul sito che risponde alle domande frequenti anche fuori orario. Ogni pacchetto ha un prezzo di setup e un canone dichiarati."
          }
        },
        {
          "@type": "Question",
          "name": "Lavorate anche con la mia agenzia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì, ed è una parte importante di quello che facciamo. Molte agenzie non hanno un tecnico interno per il tracciamento server-side o per le integrazioni: lavoriamo direttamente con loro, in white label. Il cliente resta dell’agenzia."
          }
        },
        {
          "@type": "Question",
          "name": "Lavorate solo in Emilia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Il lavoro tecnico si fa in remoto, quindi seguiamo aziende in tutta Italia. Sui progetti che richiedono presenza (advertising, consulenza continuativa) lavoriamo soprattutto tra Reggio Emilia, Modena e Parma."
          }
        },
        {
          "@type": "Question",
          "name": "Come si inizia?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Con l’audit del tracciamento, che costa 490 € e dura 3-5 giorni. È il modo più economico per capire cosa non funziona senza impegnarsi su un progetto. Il documento che ne esce resta tuo anche se poi non procediamo."
