            "@type": "Answer",
            "text": "Invece di far inviare i dati dal browser del visitatore a Meta e Google, li raccoglie un server controllato da Q4. Gli ad blocker e la tracking prevention incontrano meno ostacoli, e le piattaforme ricevono conversioni più complete."

          }
        },
        {
          "@type": "Question",
          "name": "Il tracciamento server-side è conforme al GDPR?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sì, e in più permette di ottenere più dati. Con il server-side si lavora sul dato a monte, prima che arrivi alle piattaforme, elaborandolo e anonimizzandolo. Alcuni cookie che in un setup solo client side richiederebbero un consenso specifico possono invece partire di default, e le piattaforme ricevono più informazioni: sempre in accordo con il DPO e dopo la valutazione del nostro consulente legale. A questo si aggiunge Consent Mode v2, che fa seguire i dati alle scelte di consenso dell'utente."
          }
        },

          "@type": "Question",

          }
        },
        {
          "@type": "Question",
          "name": "Quanto costa e quanto tempo serve per un'automazione?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Le automazioni partono in due settimane. Il setup parte da 490 €, il canone va da 59 a 200 € al mese."
          }
